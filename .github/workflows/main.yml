name: Restful-Booker CI Pipeline
on: [push, pull_request]

jobs:
  api-testing:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4

      - name: 2. Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 3. Cài đặt công cụ Newman (Postman CLI)
        run: npm install -g newman

      - name: 4. Chạy bộ Test tự động
        # Lệnh này sẽ giả lập việc bấm "Run Collection" như đã làm trên máy cá nhân
        run: newman run RestfulBooker_API_Collection.postman_collection.json -e RestfulBooker_Env.postman_environment.json
